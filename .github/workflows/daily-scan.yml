name: 매일 자동 스크리너 알림

on:
  schedule:
    # 매일 평일 오후 4시 KST = UTC 07:00
    - cron: '0 7 * * 1-5'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 스크리너 실행 및 카카오톡 알림
        run: |
          curl -s -X POST https://kis-proxy.wlsdn816.workers.dev/scan-kakao \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 120 \
            -w "\nHTTP Status: %{http_code}\n"
