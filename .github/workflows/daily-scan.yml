name: 매일 자동 스크리너 알림

on:
  schedule:
    # 매일 평일 오후 4시 KST = UTC 07:00
    - cron: '0 7 * * 1-5'
  workflow_dispatch:  # 수동 실행 버튼 (trigger)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 스크리너 청크 분할 실행 및 카카오톡 알림
        run: |
          WORKER="https://kis-proxy.wlsdn816.workers.dev"
          CHUNK_SIZE=50
          OFFSET=0
          SCANNED_AT=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          KOSPI_RS3M=0
          MAX_CHUNKS=200
          TOTAL=0
          # 누적 결과를 파일로 관리 (변수 내 따옴표 충돌 방지)
          ACC_FILE=$(mktemp)
          echo "[]" > "$ACC_FILE"

          echo "스캔 시작: $SCANNED_AT (chunkSize=$CHUNK_SIZE)"

          for i in $(seq 1 $MAX_CHUNKS); do

            BODY="{\"offset\":${OFFSET},\"chunkSize\":${CHUNK_SIZE},\"scannedAt\":\"${SCANNED_AT}\",\"kospiRs3m\":${KOSPI_RS3M}}"

            RESPONSE=$(curl -s -X POST "$WORKER/scan-chunk" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              --max-time 55)

            STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('ok' if d.get('ok') else 'err')" 2>/dev/null || echo "err")

            if [ "$STATUS" = "err" ]; then
              echo "청크 $i (offset=$OFFSET) 오류: $RESPONSE"
              exit 1
            fi

            DONE=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('true' if d.get('done') else 'false')" 2>/dev/null || echo "false")
            NEXT_OFFSET=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('nextOffset') or 0)" 2>/dev/null || echo "0")
            NEW_KOSPI=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('kospiRs3m', 0))" 2>/dev/null || echo "0")
            NEW_TOTAL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total', 0))" 2>/dev/null || echo "0")

            if [ -n "$NEW_KOSPI" ] && [ "$NEW_KOSPI" != "0" ]; then
              KOSPI_RS3M=$NEW_KOSPI
            fi
            if [ "$NEW_TOTAL" != "0" ]; then
              TOTAL=$NEW_TOTAL
            fi

            # 청크 결과를 파일에 누적
            CHUNK_FILE=$(mktemp)
            echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('chunkResults', [])))" > "$CHUNK_FILE" 2>/dev/null || echo "[]" > "$CHUNK_FILE"
            CHUNK_COUNT=$(python3 -c "import json; print(len(json.load(open('$CHUNK_FILE'))))" 2>/dev/null || echo "?")
            python3 -c "import json; acc=json.load(open('$ACC_FILE')); chunk=json.load(open('$CHUNK_FILE')); json.dump(acc+chunk, open('$ACC_FILE','w'))" 2>/dev/null
            rm -f "$CHUNK_FILE"

            echo "청크 $i (offset=$OFFSET, done=$DONE, 이번청크=${CHUNK_COUNT}개 히트)"

            if [ "$DONE" = "true" ]; then
              ACC_COUNT=$(python3 -c "import json; print(len(json.load(open('$ACC_FILE'))))" 2>/dev/null || echo "?")
              echo "스캔 완료! total=$TOTAL, 전체 히트=${ACC_COUNT}개"
              echo "카카오 알림 전송 및 KV 저장 중..."

              # sendFinal로 전체 결과 전송 (KV 2회만 사용)
              FINAL_FILE=$(mktemp)
              python3 -c "import json; r=json.load(open('$ACC_FILE')); print(json.dumps({'sendFinal':True,'sendKakao':True,'scannedAt':'$SCANNED_AT','total':$TOTAL,'kospiRs3m':$KOSPI_RS3M,'allResults':r}))" > "$FINAL_FILE"

              FINAL_RESP=$(curl -s -X POST "$WORKER/scan-chunk" \
                -H "Content-Type: application/json" \
                -d @"$FINAL_FILE" \
                --max-time 60)

              echo "최종 저장 및 카카오 전송 결과: $FINAL_RESP"
              rm -f "$FINAL_FILE" "$ACC_FILE"
              break
            fi

            OFFSET=$NEXT_OFFSET
            sleep 0.3
          done

          echo "전체 완료"
