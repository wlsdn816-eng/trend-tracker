name: 매일 자동 스크리너 알림

on:
  schedule:
    # GitHub는 예약 실행을 55~90분 늦게 시작하거나, 아예 건너뛰는 날이 있음 (실측).
    # → 오후 4시 훨씬 전부터 20분 간격으로 여러 번 예약을 걸어 두고,
    #    가장 먼저 올라탄 실행이 오후 4시 정각까지 기다렸다가 스캔한다.
    #    (이미 그날 스캔이 끝났으면 뒤따라온 실행은 스스로 종료)
    - cron: '0 4 * * 1-5'    # KST 13:00
    - cron: '20 4 * * 1-5'   # KST 13:20
    - cron: '40 4 * * 1-5'   # KST 13:40
    - cron: '0 5 * * 1-5'    # KST 14:00
    - cron: '20 5 * * 1-5'   # KST 14:20
    - cron: '40 5 * * 1-5'   # KST 14:40
    - cron: '0 6 * * 1-5'    # KST 15:00
    - cron: '20 6 * * 1-5'   # KST 15:20
    - cron: '40 6 * * 1-5'   # KST 15:40
  workflow_dispatch:  # 수동 실행 버튼 + Cloudflare Cron이 호출하는 문
    inputs:
      source:
        description: '호출 출처 (cloudflare = 자동 호출: 중복·휴장일 확인을 거침 / manual = 무조건 스캔)'
        required: false
        default: 'manual'

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 주말이면 중단 (KST 기준)
        id: weekday
        run: |
          DOW=$(TZ=Asia/Seoul date +%u)   # 1=월 … 6=토, 7=일
          DAY=$(TZ=Asia/Seoul date '+%Y-%m-%d (%a)')
          if [ "$DOW" -ge 6 ]; then
            echo "weekend=true" >> "$GITHUB_OUTPUT"
            echo "$DAY — 주말이므로 스캔하지 않음"
          else
            echo "weekend=false" >> "$GITHUB_OUTPUT"
            echo "$DAY — 평일, 스캔 진행"
          fi

      - name: 오늘 이미 스캔했는지 확인
        id: check
        if: (github.event_name == 'schedule' || github.event.inputs.source == 'cloudflare') && steps.weekday.outputs.weekend != 'true'
        run: |
          WORKER="https://kis-proxy.wlsdn816.workers.dev"
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          # 저장된 scannedAt은 UTC 기준이므로 KST 날짜로 환산해서 비교
          RAW=$(curl -s --max-time 20 "$WORKER/scan-result" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('scannedAt',''))" 2>/dev/null || echo "")
          if [ -n "$RAW" ]; then
            LAST_KST=$(TZ=Asia/Seoul date -d "$RAW" +%Y-%m-%d 2>/dev/null || echo "")
          else
            LAST_KST=""
          fi
          echo "오늘(KST)=$TODAY, 마지막 스캔(KST)=$LAST_KST"
          if [ "$LAST_KST" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "오늘 스캔이 이미 완료됨 → 이 실행은 종료"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 오후 4시(KST)까지 대기
        if: (github.event_name == 'schedule' || github.event.inputs.source == 'cloudflare') && steps.weekday.outputs.weekend != 'true' && steps.check.outputs.skip != 'true'
        run: |
          # 시작 시각은 Worker가 정한다 (평소 KST 16:00 = UTC 07:00, 장 마감이 늦는 날은 그에 맞춰 뒤로).
          # 조회에 실패하면 평소 시각으로 진행한다.
          START_UTC=$(curl -s --max-time 15 "https://kis-proxy.wlsdn816.workers.dev/scan-start" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('startUtc',''))" 2>/dev/null || echo "")
          case "$START_UTC" in
            [0-2][0-9]:[0-5][0-9]) ;;
            *) START_UTC="07:00" ;;
          esac
          echo "오늘 스캔 시작 시각(UTC) = $START_UTC"
          TARGET=$(date -u -d "today $START_UTC" +%s)
          NOW=$(date -u +%s)
          WAIT=$((TARGET - NOW))
          if [ "$WAIT" -gt 0 ]; then
            echo "오후 4시까지 ${WAIT}초 대기"
            sleep "$WAIT"
          else
            echo "이미 오후 4시가 지나 바로 시작 (${WAIT}초)"
          fi

      - name: 대기 후 재확인 (다른 실행이 먼저 끝냈는지)
        id: recheck
        if: (github.event_name == 'schedule' || github.event.inputs.source == 'cloudflare') && steps.weekday.outputs.weekend != 'true' && steps.check.outputs.skip != 'true'
        run: |
          WORKER="https://kis-proxy.wlsdn816.workers.dev"
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          RAW=$(curl -s --max-time 20 "$WORKER/scan-result" | python3 -c "import sys,json;print(json.load(sys.stdin).get('scannedAt',''))" 2>/dev/null || echo "")
          if [ -n "$RAW" ]; then
            LAST_KST=$(TZ=Asia/Seoul date -d "$RAW" +%Y-%m-%d 2>/dev/null || echo "")
          else
            LAST_KST=""
          fi
          echo "오늘(KST)=$TODAY, 마지막 스캔(KST)=$LAST_KST"
          if [ "$LAST_KST" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "다른 실행이 이미 완료함 → 종료"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 증시 휴장일인지 확인 (장 마감 후 기준)
        id: holiday
        if: (github.event_name == 'schedule' || github.event.inputs.source == 'cloudflare') && steps.weekday.outputs.weekend != 'true' && steps.check.outputs.skip != 'true' && steps.recheck.outputs.skip != 'true'
        run: |
          WORKER="https://kis-proxy.wlsdn816.workers.dev"
          TODAY=$(TZ=Asia/Seoul date +%Y%m%d)

          # 삼성전자 일봉의 최근 거래일이 오늘이 아니면 장이 열리지 않은 날(공휴일·임시휴장).
          # KIS 데이터 반영이 늦을 수 있어 3번까지 재시도 — 정상 거래일을 휴장으로 오판하면 손해가 크다.
          LATEST=""
          for ATTEMPT in 1 2 3; do
            LATEST=$(curl -s --max-time 30 "$WORKER/ohlcv?code=005930" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('latestDate',''))" 2>/dev/null || echo "")
            echo "시도 $ATTEMPT — 오늘(KST)=$TODAY, 최근 거래일=$LATEST"
            if [ "$LATEST" = "$TODAY" ]; then
              break
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              echo "  불일치 → 90초 후 재확인 (데이터 반영 지연 가능)"
              sleep 90
            fi
          done

          if [ -z "$LATEST" ]; then
            # 조회 자체가 실패한 경우엔 막지 않고 진행 (정상 거래일을 놓치는 쪽이 더 손해)
            echo "closed=false" >> "$GITHUB_OUTPUT"
            echo "거래일 조회 실패 → 일단 스캔 진행"
          elif [ "$LATEST" != "$TODAY" ]; then
            echo "closed=true" >> "$GITHUB_OUTPUT"
            echo "오늘은 증시 휴장일 → 스캔하지 않음 (직전 거래일: $LATEST)"
          else
            echo "closed=false" >> "$GITHUB_OUTPUT"
            echo "정상 거래일 확인 → 스캔 진행"
          fi

      - name: 스크리너 청크 분할 실행 및 카카오톡 알림
        if: steps.weekday.outputs.weekend != 'true' && steps.holiday.outputs.closed != 'true' && ((github.event_name != 'schedule' && github.event.inputs.source != 'cloudflare') || (steps.check.outputs.skip != 'true' && steps.recheck.outputs.skip != 'true'))
        run: |
          WORKER="https://kis-proxy.wlsdn816.workers.dev"
          # Cloudflare Worker는 요청 하나당 외부 호출 50번이 한도다.
          # 종목당 2회(일봉+주봉)를 쓰므로 22종목 = 44회.
          # 남는 6회는 토큰 발급·마스터파일 로드 같은 부대 호출 몫.
          # 30종목(=60회)으로 두면 뒤 5종목이 매번 한도에 걸려 통째로 날아갔다.
          CHUNK_SIZE=22
          OFFSET=0
          SCANNED_AT=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          KOSPI_RS3M=0
          MAX_CHUNKS=200
          TOTAL=0
          FAILED_TOTAL=0
          SKIPPED_TOTAL=0
          # 누적 결과를 파일로 관리 (변수 내 따옴표 충돌 방지)
          ACC_FILE=$(mktemp)
          echo "[]" > "$ACC_FILE"
          # 전 종목의 RS 값 — 시장 기준 RS 레이팅 백분위 계산에 필요
          RS_FILE=$(mktemp)
          echo "[]" > "$RS_FILE"

          echo "스캔 시작: $SCANNED_AT (chunkSize=$CHUNK_SIZE)"

          for i in $(seq 1 $MAX_CHUNKS); do

            BODY="{\"offset\":${OFFSET},\"chunkSize\":${CHUNK_SIZE},\"scannedAt\":\"${SCANNED_AT}\",\"kospiRs3m\":${KOSPI_RS3M}}"

            RESPONSE=$(curl -s -X POST "$WORKER/scan-chunk" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              --max-time 55)

            STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('ok' if d.get('ok') else 'err')" 2>/dev/null || echo "err")

            if [ "$STATUS" = "err" ]; then
              echo "청크 $i (offset=$OFFSET) 오류: $RESPONSE"
              exit 1
            fi

            DONE=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('true' if d.get('done') else 'false')" 2>/dev/null || echo "false")
            NEXT_OFFSET=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('nextOffset') or 0)" 2>/dev/null || echo "0")
            NEW_KOSPI=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('kospiRs3m', 0))" 2>/dev/null || echo "0")
            NEW_TOTAL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total', 0))" 2>/dev/null || echo "0")

            if [ -n "$NEW_KOSPI" ] && [ "$NEW_KOSPI" != "0" ]; then
              KOSPI_RS3M=$NEW_KOSPI
            fi
            if [ "$NEW_TOTAL" != "0" ]; then
              TOTAL=$NEW_TOTAL
            fi

            # 청크 결과를 파일에 누적
            CHUNK_FILE=$(mktemp)
            echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('chunkResults', [])))" > "$CHUNK_FILE" 2>/dev/null || echo "[]" > "$CHUNK_FILE"
            CHUNK_COUNT=$(python3 -c "import json; print(len(json.load(open('$CHUNK_FILE'))))" 2>/dev/null || echo "?")
            python3 -c "import json; acc=json.load(open('$ACC_FILE')); chunk=json.load(open('$CHUNK_FILE')); json.dump(acc+chunk, open('$ACC_FILE','w'))" 2>/dev/null
            rm -f "$CHUNK_FILE"

            # 전 종목 RS 값 누적 (관문 탈락 종목 포함)
            RS_CHUNK=$(mktemp)
            echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('chunkRs', [])))" > "$RS_CHUNK" 2>/dev/null || echo "[]" > "$RS_CHUNK"
            python3 -c "import json; acc=json.load(open('$RS_FILE')); chunk=json.load(open('$RS_CHUNK')); json.dump(acc+chunk, open('$RS_FILE','w'))" 2>/dev/null
            rm -f "$RS_CHUNK"

            CHUNK_FAILED=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('failed', 0))" 2>/dev/null || echo "0")
            CHUNK_SKIPPED=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('skipped', 0))" 2>/dev/null || echo "0")
            FAILED_TOTAL=$((FAILED_TOTAL + CHUNK_FAILED))
            SKIPPED_TOTAL=$((SKIPPED_TOTAL + CHUNK_SKIPPED))

            echo "청크 $i (offset=$OFFSET, done=$DONE, 히트=${CHUNK_COUNT}, 호출실패=${CHUNK_FAILED}, 데이터없음=${CHUNK_SKIPPED})"

            if [ "$DONE" = "true" ]; then
              ACC_COUNT=$(python3 -c "import json; print(len(json.load(open('$ACC_FILE'))))" 2>/dev/null || echo "?")
              echo "스캔 완료! total=$TOTAL, 전체 히트=${ACC_COUNT}개"
              echo "카카오 알림 전송 및 KV 저장 중..."

              RS_COUNT=$(python3 -c "import json; print(len(json.load(open('$RS_FILE'))))" 2>/dev/null || echo "?")
              echo "조회 성공 ${RS_COUNT}개 / 전체 ${TOTAL}개 · 데이터없음(상폐·신규·거래정지 등) ${SKIPPED_TOTAL}개 · 재시도 후에도 호출실패 ${FAILED_TOTAL}개"

              # sendFinal로 전체 결과 전송 (KV 3회만 사용)
              FINAL_FILE=$(mktemp)
              python3 -c "import json; r=json.load(open('$ACC_FILE')); m=json.load(open('$RS_FILE')); print(json.dumps({'sendFinal':True,'sendKakao':True,'scannedAt':'$SCANNED_AT','total':$TOTAL,'kospiRs3m':$KOSPI_RS3M,'allResults':r,'marketRs3m':m}))" > "$FINAL_FILE"

              FINAL_RESP=$(curl -s -X POST "$WORKER/scan-chunk" \
                -H "Content-Type: application/json" \
                -d @"$FINAL_FILE" \
                --max-time 60)

              echo "최종 저장 및 카카오 전송 결과: $FINAL_RESP"
              rm -f "$FINAL_FILE" "$ACC_FILE" "$RS_FILE"
              break
            fi

            OFFSET=$NEXT_OFFSET
            sleep 0.3
          done

          echo "전체 완료"
