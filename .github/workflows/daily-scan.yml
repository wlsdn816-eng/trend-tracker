name: 매일 자동 스크리너 알림

on:
  schedule:
    # 매일 평일 오후 4시 KST = UTC 07:00
    - cron: '0 7 * * 1-5'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 스크리너 청크 분할 실행 및 카카오톡 알림
        run: |
          WORKER="https://kis-proxy.wlsdn816.workers.dev"
          CHUNK_SIZE=10
          OFFSET=0
          SCANNED_AT=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          KOSPI_RS3M=0
          MAX_CHUNKS=500

          echo "스캔 시작: $SCANNED_AT"

          for i in $(seq 1 $MAX_CHUNKS); do

            BODY="{\"offset\":${OFFSET},\"chunkSize\":${CHUNK_SIZE},\"scannedAt\":\"${SCANNED_AT}\",\"kospiRs3m\":${KOSPI_RS3M},\"sendKakao\":false}"

            RESPONSE=$(curl -sf -X POST "$WORKER/scan-chunk" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              --max-time 30 2>&1)

            EXIT_CODE=$?
            if [ $EXIT_CODE -ne 0 ]; then
              echo "청크 $i curl 실패 (exit=$EXIT_CODE): $RESPONSE"
              exit 1
            fi

            echo "청크 $i (offset=$OFFSET): $RESPONSE"

            # done 여부 확인
            DONE=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('true' if d.get('done') else 'false')" 2>/dev/null)
            NEXT_OFFSET=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('nextOffset', 0))" 2>/dev/null)
            NEW_KOSPI=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('kospiRs3m', 0))" 2>/dev/null)
            TOTAL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total', 0))" 2>/dev/null)

            if [ -n "$NEW_KOSPI" ] && [ "$NEW_KOSPI" != "0" ]; then
              KOSPI_RS3M=$NEW_KOSPI
            fi

            if [ "$DONE" = "true" ]; then
              echo "스캔 완료! total=$TOTAL"
              break
            fi

            if [ -z "$NEXT_OFFSET" ] || [ "$NEXT_OFFSET" = "0" ]; then
              echo "nextOffset이 없음, 종료"
              break
            fi

            OFFSET=$NEXT_OFFSET

            # 마지막 청크 감지: 다음 offset이 total 이상이면 sendKakao=true
            if [ "$OFFSET" -ge "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              echo "마지막 청크 도달, 카카오 알림 전송 중..."
              FINAL_BODY="{\"offset\":${OFFSET},\"chunkSize\":${CHUNK_SIZE},\"scannedAt\":\"${SCANNED_AT}\",\"kospiRs3m\":${KOSPI_RS3M},\"sendKakao\":true}"
              FINAL_RESP=$(curl -sf -X POST "$WORKER/scan-chunk" \
                -H "Content-Type: application/json" \
                -d "$FINAL_BODY" \
                --max-time 30)
              echo "최종: $FINAL_RESP"
              break
            fi

            sleep 0.3
          done

          echo "전체 완료"
